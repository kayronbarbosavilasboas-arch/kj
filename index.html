<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Uma pergunta para você ❤️</title>

    <link rel="stylesheet" href="entrada.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

</head>

<body>


    <!-- FUNDO -->

    <div class="background">

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>

    </div>


    <!-- EFEITOS DE CORAÇÃO -->

    <div id="heartEffects"></div>


    <!-- CONTEÚDO -->

    <main class="question-container">

        <div class="question-card" id="questionCard">

            <div class="top-heart" id="topHeart">
                ♡
            </div>

            <p class="small-text">
                TENHO UMA PERGUNTA MUITO IMPORTANTE...
            </p>

            <h1 id="question">
                Você me ama?
            </h1>

            <p class="question-description" id="description">
                Pense bem antes de responder 👀❤️
            </p>


            <div class="buttons">

                <button
                    class="yes-button"
                    id="yesButton"
                >
                    Sim ❤️
                </button>

                <button
                    class="no-button"
                    id="noButton"
                >
                    Não
                </button>

            </div>

        </div>

    </main>


    <script src="entrada.js"></script>

</body>

</html>
